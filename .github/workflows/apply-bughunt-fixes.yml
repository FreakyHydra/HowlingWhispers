name: Validate bughunt fixes

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/apply-bughunt-fixes.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - run: npm run build:local
      - run: npm run lint
      - name: Remove temporary validator after success
        shell: bash
        run: |
          rm .github/workflows/apply-bughunt-fixes.yml
          git config user.name "Howling Whispers Bug Hunt"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove temporary bughunt validator"
          git push origin HEAD:dev
