name: Apply Open World Source Patch

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/apply-open-world.yml
      - scripts/patch-open-world.mjs
      - package.json

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply Open World patch
        run: node scripts/patch-open-world.mjs

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build

      - name: Commit generated source changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Open World source is already current."
            exit 0
          fi
          git config user.name "Howling Whispers CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/dreambound-app.tsx features/changelog/changelog-view.tsx CHANGELOG.md
          git commit -m "feat: apply open world runtime and changelog [skip ci]"
          git push origin HEAD:dev
