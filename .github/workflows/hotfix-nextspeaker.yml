name: Hotfix nextSpeaker scope

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/hotfix-nextspeaker.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Fix nextSpeaker scope regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/dreambound-app.tsx')
          text = p.read_text()

          old = '''    let respondAs: string | undefined;\n    if (livingCastConfig.enabled && mode === "Speak" && activeSession) {\n      const selector = createParticipantSelector(\n        livingCastConfig.participationMode,\n        baselineCast,\n        selected.name,\n      );\n      const nextSpeaker = selector.next(conversation);\n'''
          new = '''    let respondAs: string | undefined;\n    let nextSpeaker: LivingCastEntry | null = null;\n    if (livingCastConfig.enabled && mode === "Speak" && activeSession) {\n      const selector = createParticipantSelector(\n        livingCastConfig.participationMode,\n        baselineCast,\n        selected.name,\n      );\n      nextSpeaker = selector.next(conversation);\n'''

          count = text.count(old)
          if count != 2:
              raise SystemExit(f'Expected 2 nextSpeaker scope sites, found {count}')
          p.write_text(text.replace(old, new))
          PY
      - run: npm ci
      - run: npm run build:local
      - run: node --test tests/story-route.test.mjs
      - name: Commit fix and clean temporary workflows
        shell: bash
        run: |
          git config user.name "Howling Whispers Hotfix"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/hotfix-nextspeaker.yml .github/workflows/fix-next-speaker-scope.yml || true
          git add app/dreambound-app.tsx
          git commit -m "fix(chat): keep nextSpeaker in scope after generation"
          git push origin HEAD:dev
