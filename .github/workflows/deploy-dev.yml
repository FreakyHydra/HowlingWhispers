name: Deploy Howling Whispers Dev

on:
  workflow_run:
    workflows:
      - Howling Whispers CI
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: hw-dev-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy dev server
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'dev' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Validate deployment secrets
        env:
          SSH_HOST: ${{ secrets.HW_DEV_SSH_HOST }}
          SSH_USER: ${{ secrets.HW_DEV_SSH_USER }}
          SSH_KEY: ${{ secrets.HW_DEV_SSH_PRIVATE_KEY }}
          APP_DIR: ${{ secrets.HW_DEV_APP_DIR }}
          SERVICE: ${{ secrets.HW_DEV_SERVICE }}
        run: |
          test -n "$SSH_HOST" || { echo "Missing HW_DEV_SSH_HOST"; exit 1; }
          test -n "$SSH_USER" || { echo "Missing HW_DEV_SSH_USER"; exit 1; }
          test -n "$SSH_KEY" || { echo "Missing HW_DEV_SSH_PRIVATE_KEY"; exit 1; }
          test -n "$APP_DIR" || { echo "Missing HW_DEV_APP_DIR"; exit 1; }
          test -n "$SERVICE" || { echo "Missing HW_DEV_SERVICE"; exit 1; }

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.HW_DEV_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.HW_DEV_SSH_HOST }}
          SSH_PORT: ${{ secrets.HW_DEV_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${SSH_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy tested dev commit
        env:
          SSH_HOST: ${{ secrets.HW_DEV_SSH_HOST }}
          SSH_USER: ${{ secrets.HW_DEV_SSH_USER }}
          SSH_PORT: ${{ secrets.HW_DEV_SSH_PORT }}
          APP_DIR: ${{ secrets.HW_DEV_APP_DIR }}
          SERVICE: ${{ secrets.HW_DEV_SERVICE }}
        run: |
          PORT="${SSH_PORT:-22}"
          printf -v REMOTE 'export HW_APP_DIR=%q HW_SERVICE=%q HW_BRANCH=dev; cd %q; git fetch origin dev; git checkout dev; git pull --ff-only origin dev; chmod +x scripts/deploy-dev-server.sh; exec scripts/deploy-dev-server.sh' "$APP_DIR" "$SERVICE" "$APP_DIR"
          ssh -p "$PORT" "$SSH_USER@$SSH_HOST" "$REMOTE"
