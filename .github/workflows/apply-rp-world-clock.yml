name: Apply RP world clock integration

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/apply-rp-world-clock.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Apply surgical clock wiring
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "app/dreambound-app.tsx",
              '        messages: conversation.slice(-30).map(({ sender, text, speaker }) => ({ sender, text, speaker })),',
              '        messages: conversation.slice(-30).map(({ id, sender, text, speaker }) => ({ sender, text, speaker, timestamp: id })),',
          )

          replace_once(
              "app/api/novelai/route.ts",
              '} from "../../../lib/generation/compile-context.ts";\nimport { parseContextInput } from "../../../lib/context/import-export.ts";',
              '} from "../../../lib/generation/compile-context.ts";\nimport {\n  formatWorldTimestamp,\n  normalizeWorldTimestamp,\n  renderWorldClockContext,\n} from "../../../lib/generation/world-clock.ts";\nimport { parseContextInput } from "../../../lib/context/import-export.ts";',
          )

          replace_once(
              "app/api/novelai/route.ts",
              'type StoryProvider = "novelai" | "local" | "device";',
              'type StoryProvider = "novelai" | "local" | "device";\ntype TimedRoleplayMessage = RoleplayMessage & { timestamp?: number };',
          )

          replace_once(
              "app/api/novelai/route.ts",
              '  const autonomyPersisted = autonomousAgentsToArray(autonomyUpdated);\n\n  const compiled = isConnectionTest ? null : compileContext({',
              '''  const autonomyPersisted = autonomousAgentsToArray(autonomyUpdated);
  const relationshipContextInstruction = isRecord(body.character)
    ? limitedString(body.character.relationshipContextInstruction, 4000)
    : "";
  const timedMessages: RoleplayMessage[] = messages.map((message) => {
    const worldTime = formatWorldTimestamp(message.timestamp);
    return worldTime
      ? { ...message, text: `[World time: ${worldTime}] ${message.text}` }
      : message;
  });

  const compiled = isConnectionTest ? null : compileContext({''',
          )

          replace_once(
              "app/api/novelai/route.ts",
              '      relationshipContextInstruction: body.character?.relationshipContextInstruction,',
              '      relationshipContextInstruction: [relationshipContextInstruction, renderWorldClockContext(messages)].filter(Boolean).join("\\n"),',
          )

          replace_once(
              "app/api/novelai/route.ts",
              '      messages,\n      playerName,',
              '      messages: timedMessages,\n      playerName,',
          )

          replace_once(
              "app/api/novelai/route.ts",
              '''function parseMessages(v: unknown): RoleplayMessage[] {
  if (!Array.isArray(v)) return [];
  return v.slice(-30).map((m: unknown): RoleplayMessage | null => {
    if (!isRecord(m)) return null;
    const sender = limitedString(m.sender, 24);
    const text = limitedString(m.text, 4000);
    if (!ALLOWED_SENDERS.has(sender) || !text) return null;
    const speaker = m.speaker ? limitedString(m.speaker, 120) : undefined;
    return { sender: sender as RoleplayMessage["sender"], text, speaker: speaker || undefined };
  }).filter((m): m is RoleplayMessage => m !== null);
}''',
              '''function parseMessages(v: unknown): TimedRoleplayMessage[] {
  if (!Array.isArray(v)) return [];
  return v.slice(-30).map((m: unknown): TimedRoleplayMessage | null => {
    if (!isRecord(m)) return null;
    const sender = limitedString(m.sender, 24);
    const text = limitedString(m.text, 4000);
    if (!ALLOWED_SENDERS.has(sender) || !text) return null;
    const speaker = m.speaker ? limitedString(m.speaker, 120) : undefined;
    const timestamp = normalizeWorldTimestamp(m.timestamp);
    return {
      sender: sender as RoleplayMessage["sender"],
      text,
      speaker: speaker || undefined,
      ...(timestamp !== undefined ? { timestamp } : {}),
    };
  }).filter((m): m is TimedRoleplayMessage => m !== null);
}''',
          )

          Path("tests/world-clock-wiring.test.mjs").write_text('''import assert from "node:assert/strict";
import { readFileSync } from "node:fs";
import test from "node:test";

const appSource = readFileSync(new URL("../app/dreambound-app.tsx", import.meta.url), "utf8");
const routeSource = readFileSync(new URL("../app/api/novelai/route.ts", import.meta.url), "utf8");

test("client sends stable message ids as RP timestamps", () => {
  assert.match(appSource, /timestamp: id/);
});

test("generation route validates timestamps and injects Berlin world time", () => {
  assert.match(routeSource, /normalizeWorldTimestamp\(m\.timestamp\)/);
  assert.match(routeSource, /renderWorldClockContext\(messages\)/);
  assert.match(routeSource, /\[World time: \$\{worldTime\}\]/);
  assert.match(routeSource, /messages: timedMessages/);
});
''', encoding="utf-8")

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build

      - name: Commit verified integration and remove temporary workflow
        run: |
          rm .github/workflows/apply-rp-world-clock.yml
          git config user.name "Howling Whispers Dev Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: wire RP world clock into generation"
          git push origin HEAD:dev
